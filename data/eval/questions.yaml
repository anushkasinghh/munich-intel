# Gold question set for the retrieval eval. See EVAL_DESIGN.md.
#
# relevant_urls is the answer key: every page in data/raw/ that genuinely helps
# answer the question, as a normalized URL. Hand-labelled only — label by reading
# the scraped page text, never by running retrieval and keeping what it returned
# (that would score retrieval against itself and always look perfect).
#
# kind drives how results are pooled, because the failure modes are kind-specific:
#   single-company  one company's own pages should answer it
#   multi-company   needs several companies in the top k, so diversity matters
#   comparison      needs BOTH named companies; one-sided retrieval is the failure
#   aggregation     EXPECTED TO FAIL — a count over the corpus is not a passage
#                   sitting in it. Kept to size the gap the graph work later fills.
#
# expects_empty: true marks a NEGATIVE CONTROL — a question the corpus genuinely
# cannot answer, where the right behaviour is to return nothing useful. It takes no
# relevant_urls (supplying both is rejected at load). These are not scored on recall;
# they measure whether a relevance threshold is possible at all. Cosine scores here
# sit in 0.41-0.65 for everything, so if an unanswerable question scores as high as
# an answerable one, no cutoff can separate them — that is failure mode 4, measured.
#
# A question with an empty relevant_urls and no expects_empty is skipped by the CLI
# and listed as labelling backlog. It is never scored as zero.
#
# COPY URLS VERBATIM from the "url" field of the data/raw/*.json files. Do not type
# them from memory. normalize_url tolerates a trailing slash, host case, a query
# string and a fragment — but deliberately does NOT strip "www." or unify http/https,
# because those can be genuinely different hosts. So "https://marvelfusion.com" does
# not match the indexed "https://www.marvelfusion.com", and a question labelled that
# way scores 0.0 while looking correctly labelled. To list a company's real page URLs:
#
#   python -c "import json,glob; [print(d['source_type'], d['url']) for f in
#     glob.glob('data/raw/*.json') for d in [json.load(open(f))]
#     if d['company_slug']=='marvel-fusion']"
#
# ---------------------------------------------------------------------------
# COMPOSITION NOTE — why these questions and not others
#
# The set is built to be able to FAIL a plausible-but-wrong change. Phase 3a adds
# source_type to the payload, which makes "prefer site pages, drop news" an easy and
# tempting filter. An earlier draft of this file would have rewarded exactly that:
# ~20 of its questions wanted a site page, 4 could only be answered from news, and
# none wanted a careers page. Dropping news would have scored as a clear win while
# breaking every hiring and recent-events answer in the app.
#
# So the set now deliberately includes:
#   - 3 questions whose correct answer IS a careers page (ororatech/navvis/isar)
#   - 2 recency questions where news is right even though a site page exists
#     (isar-spectrum-launch, proxima-funding) — the earlier news-only questions
#     worked only because those companies lack a site page, which tests
#     availability, not preference
#   - 2 negative controls, so "returns something confident for anything" is visible
#
# Two questions were cut for being unlabellable rather than hard: an "AI software
# companies" question (15 of 21 companies mention AI/ML — any answer key is
# arguable, so it would have measured label agreement, not retrieval) and a
# "robotics" one (no clean answer set; the top match was MicroAGI, whose only real
# text is news because its site and careers pages are 1-word JS shells).
#
# Four companies appear in no question: allo, viktor, clearops, augmented-industries.
# That is deliberate — they are the distractor pool, and two of them (allo, viktor)
# have among the largest chunk counts in the index, so they are what a diversity
# metric has to compete against.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# single-company — site pages
# ---------------------------------------------------------------------------

- id: what-is-konux
  question: "What is Konux?"
  kind: single-company
  relevant_urls: []
  notes: >-
    Failure mode 3. A Google News RSS headline dump ranks 1st; konux.com/company
    is 3rd, outside a k=2 cutoff. The canonical case for source_type filtering.

- id: ororatech-wildfire
  question: "How does OroraTech detect wildfires?"
  kind: single-company
  relevant_urls: []
  notes: Richest site page in the corpus (2882 words). Should be the easy case.

- id: reverion-technology
  question: "What technology does Reverion use for its power plants?"
  kind: single-company
  relevant_urls: []
  notes: Balanced page shape — site 718 / news 622 / careers 666.

- id: voiceline-product
  question: "What does VoiceLine's sales documentation tool do?"
  kind: single-company
  relevant_urls: []
  notes: No careers page. site 378 vs news 1269 — news outweighs the real page 3:1.

- id: spaitial-3d
  question: "What is Spaitial's approach to 3D scene generation?"
  kind: single-company
  relevant_urls: []
  notes: Thin site page (167 words), careers is a 23-word shell.

- id: 1komma5-energy
  question: "What does 1Komma5Grad offer homeowners?"
  kind: single-company
  relevant_urls: []
  notes: Largest site page after OroraTech (1117); news is unusually thin (225).

- id: merantix-what
  question: "What is Merantix and how does it work with startups?"
  kind: single-company
  relevant_urls: []
  notes: Venture-studio model; tiny site page (136) against 1041 words of news.

# ---------------------------------------------------------------------------
# single-company — answerable only from news (no site page exists)
# ---------------------------------------------------------------------------

- id: what-is-helsing
  question: "What is Helsing and what do they build?"
  kind: single-company
  relevant_urls: []
  notes: >-
    Helsing has no site page in data/raw/ — only news (2697 words) and careers.
    Tests whether a company can be described at all from news chunks alone.

- id: quantum-systems-drones
  question: "What does Quantum Systems make?"
  kind: single-company
  relevant_urls: []
  notes: No site page either; news-only + careers, same shape as Helsing.

- id: twaice-battery
  question: "What does TWAICE do?"
  kind: single-company
  relevant_urls: []
  notes: >-
    Only ONE page in the whole index (news, 848 words). The cleanest test of
    whether a single relevant page can be surfaced at all.

- id: microagi-what
  question: "What is MicroAGI building?"
  kind: single-company
  relevant_urls: []
  notes: >-
    JS shell: site and careers are 1 word each. Only news (742) carries content.
    If this is unanswerable, that is a scraping finding, not a retrieval one.

# ---------------------------------------------------------------------------
# single-company — news is correct DESPITE a site page existing
#
# The guard against over-filtering. Unlike the four above, these companies have
# real site pages, so a "prefer site, drop news" change would answer them from the
# wrong source and these questions would catch it.
# ---------------------------------------------------------------------------

- id: isar-spectrum-launch
  question: "What happened with Isar Aerospace's Spectrum rocket launch?"
  kind: single-company
  relevant_urls: []
  notes: >-
    A specific recent event. isaraerospace.com exists (371 words) but is marketing
    copy; the launch is only in the news feed (2723 words). Label the news page.

- id: proxima-funding
  question: "How much funding has Proxima Fusion raised?"
  kind: single-company
  relevant_urls: []
  notes: >-
    Funding amounts live in news, not on the company site (365 words). Pairs with
    most-funded-company: this one IS answerable from a passage, that one is not.

# ---------------------------------------------------------------------------
# single-company — careers pages are the correct answer
#
# 19 careers pages are indexed and nothing else in this set tests them. Without
# these, a filter that down-weights everything but site pages would score as an
# improvement while making the app unable to answer any hiring question.
# ---------------------------------------------------------------------------

- id: ororatech-roles
  question: "What roles is OroraTech hiring for?"
  kind: single-company
  relevant_urls: []
  notes: >-
    Largest careers page in the corpus (1210 words), ATS-backed. Note the page is
    partly a pointer to ororatech.com/company/careers — label what is indexed.

- id: navvis-hiring
  question: "Is NavVis hiring, and for what kind of positions?"
  kind: single-company
  relevant_urls: []
  notes: >-
    Careers page (939) is nearly twice the site page (506) — the one company where
    the careers page is the dominant source. Text includes "Open positions".

- id: isar-aerospace-jobs
  question: "What jobs are open at Isar Aerospace?"
  kind: single-company
  relevant_urls: []
  notes: >-
    Careers page is 1108 words with no per-job links — the page the jobs eval
    showed producing 8 fabricated postings. Retrieval gold is still "this is the
    right page to surface"; whether it lists jobs usefully is the extractor's problem.

# ---------------------------------------------------------------------------
# multi-company — the diversity tests
# ---------------------------------------------------------------------------

- id: fusion-companies
  question: "Which Munich startups are working on nuclear fusion?"
  kind: multi-company
  relevant_urls: []
  notes: >-
    Failure mode 1. Returns marvel-fusion at ranks 1-6, proxima-fusion first at
    rank 7. At k=2 the answer can never name both.

- id: munich-space-companies
  question: "Which Munich companies work on space or satellite technology?"
  kind: multi-company
  relevant_urls: []
  notes: >-
    isar-aerospace and ororatech at minimum. Second diversity test, on a pair with
    very different page shapes (Isar news-heavy, OroraTech site-heavy at 2882 words).

- id: defence-companies
  question: "Which Munich startups work in defence or dual-use technology?"
  kind: multi-company
  relevant_urls: []
  notes: helsing and quantum-systems at minimum; both are news-heavy, no site page.

- id: climate-energy-companies
  question: "Which Munich startups work on clean energy or climate technology?"
  kind: multi-company
  relevant_urls: []
  notes: >-
    Widest expected answer set — reverion, 1komma5grad, ocell, ororatech, twaice.
    Recall@2 is capped near 0.2 here by construction; read recall@10.

- id: hardware-sensor-companies
  question: "Which Munich companies build physical sensors or hardware?"
  kind: multi-company
  relevant_urls: []
  notes: blickfeld, navvis, ocell, ororatech. Cross-cuts the category field.

# ---------------------------------------------------------------------------
# multi-company — NEGATIVE CONTROLS (expects_empty)
#
# Nothing in the corpus answers these. They take no labels; they exist to measure
# whether an unanswerable question can be told apart from an answerable one by
# score. If the best score here matches the best score on a real question, then
# failure mode 4 is confirmed and no relevance threshold will ever work.
# ---------------------------------------------------------------------------

- id: no-consumer-social
  question: "Which Munich startups build consumer social media apps?"
  kind: multi-company
  expects_empty: true
  notes: >-
    Verified absent: zero matches for "social media app" or "consumer social"
    across all 74 scraped pages. The clean control.

- id: no-autonomous-vehicles
  question: "Which Munich startups are building self-driving cars?"
  kind: multi-company
  expects_empty: true
  notes: >-
    The harder control. No company does this, but Blickfeld's news feed contains
    "autonomous 3D load measurement in mining" and Blickfeld makes lidar — a
    superficially close false friend. Tests whether retrieval latches onto it.

# ---------------------------------------------------------------------------
# comparison — both sides must be retrieved
# ---------------------------------------------------------------------------

- id: compare-proxima-marvel
  question: "Compare Proxima Fusion and Marvel Fusion."
  kind: comparison
  relevant_urls: []
  notes: >-
    Failure mode 2. Returns two Proxima chunks and zero Marvel at k=2; Marvel first
    appears at rank 4, and the top 10 is 7 Proxima to 3 Marvel. Label both
    companies' pages — recall of 0.5 here means a confidently one-sided answer.

- id: compare-helsing-quantum
  question: "How do Helsing and Quantum Systems differ in what they build?"
  kind: comparison
  relevant_urls: []
  notes: Both news-heavy with no site page — the hardest comparison in the set.

- id: compare-ororatech-ocell
  question: "What is the difference between OroraTech and Ocell?"
  kind: comparison
  relevant_urls: []
  notes: >-
    Both are satellite-data companies (fire vs forestry), so their embeddings sit
    close together. Tests whether near-neighbours crowd each other out.

- id: compare-isar-marvel
  question: "Which is further along, Isar Aerospace or Marvel Fusion?"
  kind: comparison
  relevant_urls: []
  notes: >-
    Unrelated domains, both news-heavy (2723 / 2526). Tests whether two distant
    companies can share a top-k at all, and whether news chunks dominate both sides.

# ---------------------------------------------------------------------------
# aggregation — EXPECTED TO FAIL, reported separately
#
# Trimmed to two. These exist to size the gap that the graph work fills, not to be
# fixed by tuning retrieval, and a correct answer key for count-hiring-companies is
# all 19 careers pages — which caps recall@10 at 0.53 by arithmetic alone. Label
# these lightly (a representative handful is enough); the number is not meant to
# be read as a retrieval score, only to stay pinned near the floor.
# ---------------------------------------------------------------------------

- id: count-hiring-companies
  question: "How many Munich startups are currently hiring?"
  kind: aggregation
  relevant_urls: []
  notes: >-
    Requires counting across every careers page. No single passage contains the
    answer. This is the question the graph work exists to answer.

- id: most-funded-company
  question: "Which Munich startup has raised the most funding?"
  kind: aggregation
  relevant_urls: []
  notes: >-
    Requires comparing FundingRound amounts across companies. Individual rounds do
    appear in news chunks, so this may score non-zero recall while still answering
    wrongly — a standing demonstration that recall is not correctness.
