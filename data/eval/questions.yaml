# ---------------------------------------------------------------------------
# aggregation — EXPECTED TO FAIL, reported separately
# ---------------------------------------------------------------------------
# These exist to size the gap, not to be fixed. Label relevant_urls with the pages
# that would have to be read to answer correctly — that is what makes "retrieval
# cannot do this" a measured claim rather than an assertion.

- id: count-hiring-companies
  question: "How many Munich startups are currently hiring?"
  kind: aggregation
  relevant_urls: []
  notes: >-
    Requires counting across every careers page. No single passage contains the
    answer. This is the question the graph work exists to answer.

- id: most-funded-company
  question: "Which Munich startup has raised the most funding?"
  kind: aggregation
  relevant_urls: []
  notes: Requires comparing FundingRound amounts across companies.

- id: fusion-vs-space-count
  question: "Are there more fusion startups or more space startups in Munich?"
  kind: aggregation
  relevant_urls: []
  notes: Two counts and a comparison. Retrieval can supply evidence, never the answer.

- id: recent-funding-rounds
  question: "Which Munich startups raised funding most recently?"
  kind: aggregation
  relevant_urls: []
  notes: >-
    Needs dates ordered across companies. News chunks may contain individual
    rounds, so this may score non-zero recall while still answering wrongly —
    a useful demonstration that recall is not correctness.
